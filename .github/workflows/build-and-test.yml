name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NeuralInferenceContract.sln
      - name: Build
        run: dotnet build NeuralInferenceContract.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test NeuralInferenceContract.sln --configuration Release --no-build --no-restore
